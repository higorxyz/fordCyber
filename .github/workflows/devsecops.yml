name: DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-0123456789012345678901
      PAYLOAD_SIGNING_SECRET: ci-payload-secret-0123456789012345
      CRON_SECRET: ci-cron-secret-012345678901
      DATA_ENCRYPTION_KEY: ci-data-key-0123456789012345678901
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: CiAdminPassw0rd!
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/owasp-top-ten p/typescript

      - name: Install Semgrep CLI for JSON report
        run: python -m pip install semgrep

      - name: Save Semgrep report
        if: always()
        shell: bash
        run: |
          semgrep scan --config p/owasp-top-ten --config p/typescript --json --output semgrep-report.json . || true
          semgrep scan --config p/owasp-top-ten --config p/typescript --sarif --output semgrep.sarif . || true
          test -f semgrep-report.json || printf '{"results":[],"errors":[{"message":"Semgrep execution failed"}]}' > semgrep-report.json
          test -f semgrep.sarif || printf '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep-report.json
            semgrep.sarif
          if-no-files-found: warn

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  secret-scanning:
    name: Secret Scanning - TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run TruffleHog action
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --json

      - name: Run TruffleHog against repository history
        continue-on-error: true
        run: trufflehog git file://. --json > trufflehog-report.json

      - name: Save TruffleHog report
        if: always()
        shell: bash
        run: |
          test -f trufflehog-report.json || printf '{"status":"scan_failed"}' > trufflehog-report.json

      - name: Upload TruffleHog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          if-no-files-found: warn